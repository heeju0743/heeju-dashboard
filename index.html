<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>희주 대시보드 - MY PERSONAL SPACE</title>
    <style>
        @import url('https://jsdelivr.net');
        
        :root {
            --bg-color: #f3f4f6;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --primary-purple: #6366f1;
            --primary-light: #e0e7ff;
            --profit-red: #ef4444;
            --loss-blue: #3b82f6;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
        }

        /* 사이드바 UI (원본 스타일 그대로 복원) */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            overflow-y: auto;
            padding: 24px 16px;
            box-sizing: border-box;
        }

        .sidebar-brand { font-size: 16px; font-weight: 700; color: #111827; margin-bottom: 2px; }
        .sidebar-sync { font-size: 11px; color: var(--text-muted); margin-bottom: 16px; }
        .sidebar-quote { font-size: 12px; color: #4b5563; font-style: italic; margin-bottom: 24px; padding-left: 2px; }
        
        .menu-group { margin-bottom: 16px; }
        .menu-group-title { font-size: 11px; font-weight: 700; color: #9ca3af; margin-bottom: 6px; padding-left: 4px; text-transform: uppercase; }
        .menu-item { display: flex; align-items: center; padding: 8px 12px; color: #4b5563; text-decoration: none; border-radius: 6px; font-size: 13px; font-weight: 500; margin-bottom: 2px; cursor: pointer; transition: all 0.15s; }
        .menu-item:hover, .menu-item.active { background-color: #f3f4f6; color: var(--primary-purple); font-weight: 700; }
        .menu-item .icon { margin-right: 8px; font-size: 14px; }

        /* 메인 콘텐츠 구조 */
        .main-container { margin-left: 250px; padding: 30px; width: calc(100% - 250px); box-sizing: border-box; min-height: 100vh; }
        
        /* 카드 컴포넌트 */
        .card { background-color: var(--card-bg); border-radius: 8px; padding: 20px; border: 1px solid var(--border-color); box-shadow: 0 1px 2px rgba(0,0,0,0.04); margin-bottom: 20px; }
        .card-title { margin-top: 0; margin-bottom: 16px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        
        /* 레이아웃 그리드 */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .grid-button-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }

        /* 폼 컨트롤 */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .form-item { display: flex; flex-direction: column; margin-bottom: 12px; }
        .form-item label { font-size: 12px; font-weight: 600; color: #4b5563; margin-bottom: 4px; }
        .form-item input, .form-item select, .form-item textarea { padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; background-color: #fafafa; color: var(--text-main); font-family: inherit; box-sizing: border-box; }
        .form-item textarea { height: 70px; resize: none; }
        
        /* 테이블 리디자인 */
        table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12px; }
        th, td { padding: 10px; border: 1px solid var(--border-color); text-align: center; }
        th { background-color: #fafafa; font-weight: 600; color: var(--text-muted); }

        /* 공통 버튼 */
        button { background-color: var(--primary-purple); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
        button:hover { background-color: #4f46e5; }
        .btn-block { width: 100%; display: block; }
        .btn-secondary { background-color: #6b7280; }
        .btn-secondary:hover { background-color: #55585d; }
        .btn-inline { width: auto; padding: 5px 10px; font-size: 12px; }
        .btn-tab { background-color: #e5e7eb; color: #374151; font-size: 12px; padding: 4px 10px; }
        .btn-tab.active { background-color: var(--primary-purple); color: white; }

        /* 월별 차트 그래프 시각화 */
        .chart-container { display: flex; align-items: flex-end; justify-content: space-around; height: 140px; padding: 16px 10px 6px 10px; background: #fafafa; border-radius: 6px; border: 1px solid var(--border-color); margin-top: 10px; }
        .chart-bar-wrapper { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; width: 50px; }
        .chart-bar { width: 20px; border-radius: 3px 3px 0 0; min-height: 4px; transition: height 0.4s ease-in-out; position: relative; }
        .chart-bar.plus { background-color: var(--profit-red); }
        .chart-bar.minus { background-color: var(--loss-blue); }
        .chart-label { font-size: 10px; color: var(--text-muted); margin-top: 4px; font-weight: 600; }
        .chart-tooltip { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); background: #111827; color: white; padding: 2px 4px; border-radius: 3px; font-size: 9px; font-weight: bold; white-space: nowrap; opacity: 0; transition: opacity 0.15s; pointer-events: none; }
        .chart-bar-wrapper:hover .chart-tooltip { opacity: 1; }

        /* 섹션 보기 제어 엔진 */
        .section-view { display: none; }
        .section-view.active { display: block; }
        
        .badge { padding: 3px 5px; border-radius: 4px; font-weight: 700; font-size: 10px; }
        .bg-win { background-color: #fee2e2; color: var(--profit-red); }
        .bg-loss { background-color: #dbeafe; color: var(--loss-blue); }
    </style>
</head>
